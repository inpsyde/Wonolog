name: PHP Integration Tests

on:
    push:
        paths:
            - '**workflows/php-integration-tests.yml'
            - '**workflows/php-integration-suppress-deprecated.php'
            - '**.php'
            - '**phpunit-integration.xml.dist'
            - '**composer.json'
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    integration-tests:
        runs-on: ubuntu-latest
        if: ${{ !contains(github.event.head_commit.message, 'skip integration') }}

        strategy:
            fail-fast: false
            matrix:
                php-versions: [ '8.2', '8.3', '8.4', '8.5' ]
                dependency-versions: [ 'lowest', 'highest' ]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # syde/wp-phpunit-integration treats any output on the wp-cli subprocess's stderr as
            # fatal, and a deprecation notice deep in a bundled wp-cli dependency writes there
            # under CI's non-interactive/piped output (see php-integration-suppress-deprecated.php
            # for details). auto_prepend_file installs an error handler, before any other code
            # (including WP-CLI's own bootstrap) runs, that silently swallows only E_DEPRECATED.
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: pdo, pdo_sqlite
                  ini-values: auto_prepend_file=${{ github.workspace }}/.github/workflows/php-integration-suppress-deprecated.php
                  coverage: none

            - name: Install Composer dependencies
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: ${{ matrix.dependency-versions }}

            - name: Run integration tests
              run: composer tests:integration
