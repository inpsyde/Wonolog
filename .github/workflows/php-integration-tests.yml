name: PHP Integration Tests

on:
    push:
        paths:
            - '**workflows/php-integration-tests.yml'
            - '**workflows/docker/**'
            - '**.php'
            - '**phpunit.xml.dist'
            - '**composer.json'
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    integration-tests:
        name: integration-tests (php 8.1, ${{ matrix.dependency-versions }})
        runs-on: ubuntu-latest
        if: ${{ !contains(github.event.head_commit.message, 'skip integration') }}
        # PHP 8.2+ is covered by php-wp-phpunit-integration.yml instead (same test files, SQLite
        # instead of Docker/MariaDB). This Docker-based workflow is kept only for PHP 8.1, which
        # syde/wp-phpunit-integration can't run on.
        strategy:
            fail-fast: false
            matrix:
                dependency-versions: [ 'lowest', 'highest' ]
        steps:
            -   name: Checkout
                uses: actions/checkout@v3

            -   name: Copy wait-for
                run: |
                    cp .github/workflows/docker/install-composer.sh .github/workflows/docker/php81/install-composer.sh
                    cp .github/workflows/docker/wait-for.sh .github/workflows/docker/php81/wait-for.sh

            -   name: Run integration tests
                working-directory: .github/workflows/docker
                run: |
                    COMPOSER_DEPENDENCY_VERSIONS=${{ matrix.dependency-versions == 'lowest' && '--prefer-lowest' || '' }}
                    docker compose run --rm php81 sh -c "wait-for.sh wonolog-db:3306 -t 15 -- composer update $COMPOSER_DEPENDENCY_VERSIONS && composer tests:integration"
