# `syde/wp-phpunit-integration` requires PHP >=8.2, so it's installed manually here (PHP 8.2+
# matrix only) instead of via composer.json or the shared reusable workflow, to avoid raising
# the PHP floor for the whole package (Wonolog still supports PHP 8.1).
# This only checks the package installs cleanly; the actual test migration is tracked separately.
name: PHP WP-PHPUnit-Integration Install Check

on:
    push:
        paths:
            - '**workflows/php-wp-phpunit-integration.yml'
            - '**.php'
            - '**phpunit-integration-wp-phpunit.xml.dist'
            - '**composer.json'
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    integration-tests:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php-versions: [ '8.2', '8.3', '8.4', '8.5' ]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: pdo, pdo_sqlite
                  coverage: none

            - name: Install Composer dependencies
              uses: ramsey/composer-install@v3

            # wpackagist.org hosts a transitive dependency not on Packagist, and symfony/process
            # needs bumping past our pinned ^6.4.20 to satisfy this package's requirement. A
            # fresh cache dir avoids reusing a stale wpackagist provider index from the previous
            # step's cached Composer cache, which caused sporadic 404s.
            - name: Install syde/wp-phpunit-integration (manual, PHP 8.2+ only)
              env:
                  COMPOSER_CACHE_DIR: ${{ runner.temp }}/composer-cache-wp-phpunit-integration
              run: |
                  composer config repositories.wpackagist composer https://wpackagist.org
                  composer require --dev syde/wp-phpunit-integration "symfony/process:>=7.4" --no-interaction -W

    # Manually-triggered only. Reproduces a syde/wp-phpunit-integration bug in isolation, with no
    # Wonolog code involved: Bootstrap::init() loads WordPress in PHPUnit's main process too (not
    # just isolated child processes), leaving closures from WP's own hook system in $GLOBALS. That
    # crashes PHPUnit's @runTestsInSeparateProcesses, which needs to snapshot $GLOBALS to hand off
    # to each isolated child. This job is expected to fail; it exists to link a real CI run in the
    # upstream bug report, not to pass.
    isolation-bug-repro:
        if: ${{ github.event_name == 'workflow_dispatch' }}
        runs-on: ubuntu-latest

        steps:
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: pdo, pdo_sqlite
                  coverage: none

            - name: Scaffold minimal reproduction
              run: |
                  mkdir -p repro/tests/Integration

                  cat > repro/composer.json <<'JSON'
                  {
                      "name": "acme/wp-phpunit-integration-isolation-repro",
                      "type": "project",
                      "license": "MIT",
                      "require": {
                          "php": ">=8.2"
                      },
                      "require-dev": {
                          "phpunit/phpunit": "^9.6",
                          "roots/wordpress-no-content": ">=6.1.1",
                          "syde/wp-phpunit-integration": "^0.4.1",
                          "symfony/process": ">=7.4"
                      },
                      "config": {
                          "allow-plugins": {
                              "composer/installers": true
                          }
                      }
                  }
                  JSON

                  cat > repro/tests/bootstrap-integration.php <<'PHP'
                  <?php

                  declare(strict_types=1);

                  use Syde\WpPhpUnitIntegration\Bootstrap;

                  $packagePath = dirname(__DIR__);
                  $vendorPath = "{$packagePath}/vendor";

                  if (!realpath($vendorPath)) {
                      die('Please install via Composer before running tests.');
                  }

                  require_once "{$vendorPath}/autoload.php";

                  Bootstrap::init($packagePath);

                  unset($packagePath, $vendorPath);
                  PHP

                  cat > repro/phpunit-integration.xml.dist <<'XML'
                  <?xml version="1.0" encoding="UTF-8"?>
                  <phpunit
                          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                          xsi:noNamespaceSchemaLocation="vendor/phpunit/phpunit/phpunit.xsd"
                          bootstrap="tests/bootstrap-integration.php">
                      <testsuites>
                          <testsuite name="integration">
                              <directory>tests/Integration</directory>
                          </testsuite>
                      </testsuites>
                  </phpunit>
                  XML

                  cat > repro/tests/Integration/IsolationCrashTest.php <<'PHP'
                  <?php

                  declare(strict_types=1);

                  namespace Acme\Tests\Integration;

                  use PHPUnit\Framework\TestCase;

                  /**
                   * @runTestsInSeparateProcesses
                   */
                  class IsolationCrashTest extends TestCase
                  {
                      /**
                       * @test
                       */
                      public function itLoadsWordPress(): void
                      {
                          static::assertTrue(function_exists('do_action'));
                      }
                  }
                  PHP

            - name: Install dependencies
              working-directory: repro
              run: |
                  composer config repositories.wpackagist composer https://wpackagist.org
                  composer install --no-interaction --no-progress

            - name: Run isolated test (expected to crash)
              working-directory: repro
              run: php vendor/phpunit/phpunit/phpunit -c phpunit-integration.xml.dist
