# `syde/wp-phpunit-integration` requires PHP >=8.2, so it's installed manually here (PHP 8.2+
# only) instead of via composer.json or the shared reusable workflow, to keep Wonolog on PHP 8.1.
name: PHP WP-PHPUnit-Integration Tests

on:
    push:
        paths:
            - '**workflows/php-wp-phpunit-integration.yml'
            - '**.php'
            - '**phpunit-integration-wp-phpunit.xml.dist'
            - '**composer.json'
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    integration-tests:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php-versions: [ '8.2', '8.3', '8.4', '8.5' ]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # syde/wp-phpunit-integration treats any output on the wp-cli subprocess's stderr as
            # fatal, and deprecation notices deep in johnpbloch/wp-cli-phar's bundled dependencies
            # (unrelated to our own code) write there under this runner's CLI defaults -- via two
            # independent channels (display_errors and the separate log_errors/error_log, whose
            # CLI default is also stderr). Redirecting both to stdout/off avoids the crash without
            # touching error_reporting, so a real deprecation in Wonolog's own code run by these
            # tests still surfaces normally.
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: pdo, pdo_sqlite
                  ini-values: display_errors=On, log_errors=Off
                  coverage: none

            - name: Install Composer dependencies
              uses: ramsey/composer-install@v3

            # wpackagist.org and a symfony/process bump are needed for this package; the isolated
            # cache dir avoids stale wpackagist metadata.

            # globalis/wp-cli-bin (only needed by the separate Docker-based integration tests) is removed here because
            # it and johnpbloch/wp-cli-phar (this package's own WP-CLI dependency) both register a `wp`
            # binary; the package finds *some* file named `wp` in the project rather than its own
            # dependency specifically, so leaving both installed makes which one it runs
            # non-deterministic. Additionally, globalis/wp-cli-bin fails because of an old bug.
            - name: Install syde/wp-phpunit-integration (manual, PHP 8.2+ only)
              env:
                  COMPOSER_CACHE_DIR: ${{ runner.temp }}/composer-cache-wp-phpunit-integration
              run: |
                  composer config repositories.wpackagist composer https://wpackagist.org
                  composer require --dev syde/wp-phpunit-integration "symfony/process:>=7.4" --no-interaction -W
                  composer remove --dev globalis/wp-cli-bin --no-interaction

            # TEMPORARY: diagnosing why display_errors=On/log_errors=Off didn't stop the
            # PHP 8.5 job from still crashing on stderr output -- remove once resolved.
            - name: Debug PHP error settings
              run: php -i | grep -E "^display_errors|^log_errors|^error_log |^error_reporting "

            - name: Run integration tests via syde/wp-phpunit-integration
              run: composer tests:integration:wp-phpunit
